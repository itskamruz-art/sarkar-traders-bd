<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarkar Traders BD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f5f7fb}
header{background:#0f172a;color:#fff;padding:18px;text-align:center;position:sticky;top:0}
.tabs{display:flex;gap:8px;justify-content:center;padding:12px;flex-wrap:wrap}
.tab{padding:9px 16px;border-radius:20px;border:1px solid #ddd;background:#fff;font-weight:700}
.tab.active{background:#0f172a;color:#fff}
.container{max-width:1100px;margin:auto;padding:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.06);padding:8px;text-align:center}
.card img{width:100%;height:130px;object-fit:cover;border-radius:8px}
.card h3{font-size:14px;margin:6px 0}
.card p{color:#e11d48;font-weight:800}
.btn{width:100%;padding:8px;background:#0f172a;color:#fff;border:0;border-radius:8px;margin-top:6px}
.add{background:#fff;max-width:480px;margin:18px auto;padding:14px;border-radius:12px}
.add input,.add select{width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:8px}
.add button{width:100%;padding:11px;background:#16a34a;color:#fff;border:0;border-radius:8px;font-weight:700}
footer{text-align:center;padding:16px;opacity:.6}
</style>
</head>
<body>
<header><h1>Sarkar Traders BD</h1><p>Fashion | Electronics | Cosmetic</p></header><div class="tabs">
<button class="tab active" onclick="show('all',this)">সব</button>
<button class="tab" onclick="show('fashion',this)">Fashion</button>
<button class="tab" onclick="show('electronics',this)">Electronics</button>
<button class="tab" onclick="show('cosmetic',this)">Cosmetic</button>
</div>
<div class="container">
<div class="grid" id="grid"></div>
<div class="add">
<h3 style="text-align:center">+ পণ্য যোগ করুন</h3>
<select id="shop">
<option value="fashion">Fashion</option>
<option value="electronics">Electronics</option>
<option value="cosmetic">Cosmetic</option>
</select>
<input id="name" placeholder="পণ্যের নাম">
<input id="price" type="number" placeholder="দাম">
<input id="img" placeholder="ছবির লিংক">
<button onclick="add()">যোগ করুন</button>
</div>
</div>
<footer>Sarkar Traders BD - Rajshahi</footer><script>
let products=JSON.parse(localStorage.getItem('sarkar')||'[]');
if(products.length==0){products=[
{c:'fashion',n:'Men T-Shirt',p:550,i:'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400'},
{c:'electronics',n:'Headphone',p:1250,i:'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400'},
{c:'cosmetic',n:'Face Cream',p:850,i:'https://images.unsplash.com/photo-1556228720-195a672e8a03?w=400'}
];}
function render(f='all'){let g=document.getElementById('grid');g.innerHTML='';let list=f=='all'?products:products.filter(x=>x.c==f);list.forEach(x=>{g.innerHTML+=`<div class="card"><img src="${x.i}"><h3>${x.n}</h3><p>৳${x.p}</p><button class="btn">Order</button></div>`})}
function show(f,e){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));e.classList.add('active');render(f)}
function add(){let c=document.getElementById('shop').value,n=document.getElementById('name').value,p=document.getElementById('price').value,i=document.getElementById('img').value;if(!n||!p||!i){alert('সব পূরণ করুন');return}products.push({c,n,p,i});localStorage.setItem('sarkar',JSON.stringify(products));render();document.getElementById('name').value='';document.getElementById('price').value='';document.getElementById('img').value='';alert('যোগ হইছে!')}
render();
</script>
</body>
</html>
